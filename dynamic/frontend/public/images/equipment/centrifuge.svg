<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="rotor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- Motion Spin Rings Background -->
  <circle cx="400" cy="300" r="230" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="12 16" opacity="0.3"/>
  <circle cx="400" cy="300" r="250" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="8 8" opacity="0.2"/>

  <!-- CENTRIFUGE BODY (TOP VIEW BENCHTOP REFRIGERATED CENTRIFUGE) -->
  <rect x="180" y="100" width="440" height="400" rx="48" fill="url(#body)" stroke="#94a3b8" stroke-width="6"/>

  <!-- CHAMBER BOWL -->
  <circle cx="400" cy="280" r="140" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="400" cy="280" r="132" fill="url(#rotor)"/>

  <!-- ROTOR HUB &amp; TUBES -->
  <circle cx="400" cy="280" r="40" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="400" cy="280" r="16" fill="#334155"/>

  <!-- 12 ANGLE ROTOR SAMPLE TUBES -->
  <!-- Tube 1 (Top) -->
  <rect x="393" y="165" width="14" height="35" rx="4" fill="#38bdf8" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Tube 7 (Bottom) -->
  <rect x="393" y="360" width="14" height="35" rx="4" fill="#38bdf8" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Tube 4 (Right) -->
  <rect x="495" y="273" width="35" height="14" rx="4" fill="#ef4444" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Tube 10 (Left) -->
  <rect x="270" y="273" width="35" height="14" rx="4" fill="#ef4444" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Diagonal Tubes -->
  <rect x="460" y="195" width="14" height="35" rx="4" fill="#38bdf8" stroke="#e2e8f0" stroke-width="2" transform="rotate(45 467 212)"/>
  <rect x="326" y="330" width="14" height="35" rx="4" fill="#38bdf8" stroke="#e2e8f0" stroke-width="2" transform="rotate(45 333 347)"/>
  <rect x="326" y="195" width="14" height="35" rx="4" fill="#10b981" stroke="#e2e8f0" stroke-width="2" transform="rotate(-45 333 212)"/>
  <rect x="460" y="330" width="14" height="35" rx="4" fill="#10b981" stroke="#e2e8f0" stroke-width="2" transform="rotate(-45 467 347)"/>

  <!-- FRONT CONTROL PANEL BOARD -->
  <rect x="220" y="440" width="360" height="42" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Speed Display -->
  <text x="250" y="466" fill="#2dd4bf" font-family="monospace" font-size="16" font-weight="bold">14,800 RPM</text>
  <!-- Temp Display -->
  <text x="390" y="466" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">4.0 °C</text>
  <!-- Start Button -->
  <circle cx="535" cy="461" r="12" fill="#10b981"/>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="280" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#2dd4bf"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">HIGH-SPEED CENTRIFUGE</text>
</svg>
