<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- Frost Sparks Background Graphics -->
  <path d="M 120 120 L 160 160 M 160 120 L 120 160 M 140 110 L 140 170 M 110 140 L 170 140" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- DEEP FREEZER UPRIGHT CABINET -->
  <rect x="240" y="100" width="320" height="440" rx="32" fill="#f8fafc" stroke="#475569" stroke-width="6"/>

  <!-- INSULATED FRONT DOOR -->
  <rect x="260" y="120" width="280" height="340" rx="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4"/>

  <!-- HEAVY SECURITY DOOR HANDLE -->
  <rect x="510" y="240" width="20" height="120" rx="8" fill="#334155"/>
  <rect x="500" y="280" width="20" height="40" rx="6" fill="#0284c7"/>

  <!-- DIGITAL CONTROL LCD SCREEN PANEL -->
  <rect x="260" y="470" width="280" height="50" rx="12" fill="#0f172a"/>
  <text x="285" y="502" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold">-86.0 °C</text>
  <text x="440" y="502" fill="#22c55e" font-family="monospace" font-size="14" font-weight="bold">FROZEN</text>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="300" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#38bdf8"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">ULT FREEZER (-80°C CRYOGENIC)</text>
</svg>
