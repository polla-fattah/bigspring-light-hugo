<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- BASE STAND &amp; HEATING BATH -->
  <rect x="200" y="420" width="400" height="80" rx="20" fill="#334155" stroke="#475569" stroke-width="4"/>
  
  <!-- ROTARY HEATING FLASK -->
  <circle cx="280" cy="360" r="60" fill="url(#glass)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Fluid in Flask -->
  <path d="M 225 370 A 55 55 0 0 0 335 370 Z" fill="#ef4444" opacity="0.8"/>

  <!-- DIAGONAL CONDENSER GLASS COIL UNIT -->
  <line x1="320" y1="320" x2="480" y2="160" stroke="#7dd3fc" stroke-width="24" stroke-linecap="round"/>
  <!-- Internal Glass Spiral Coil -->
  <path d="M 340 300 Q 360 270 380 290 T 420 250 T 460 210" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- RECEIVING RECOVERY FLASK -->
  <circle cx="520" cy="380" r="50" fill="url(#glass)" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 475 390 A 45 45 0 0 0 565 390 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- DIGITAL CONTROL MOTOR DISPLAY -->
  <rect x="420" y="440" width="160" height="45" rx="10" fill="#0f172a"/>
  <text x="435" y="468" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">120 RPM</text>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="310" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#38bdf8"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">DISTILLATION / ROTARY EVAPORATOR</text>
</svg>
