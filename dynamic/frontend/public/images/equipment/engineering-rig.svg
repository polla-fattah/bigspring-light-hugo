<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- WIND TUNNEL / AERODYNAMIC RIG DUCT -->
  <path d="M 150,260 Q 250,200 400,200 L 650,200 L 650,380 L 400,380 Q 250,380 150,320 Z" fill="#334155" stroke="#94a3b8" stroke-width="6"/>
  <ellipse cx="150" cy="290" rx="30" ry="30" fill="#1e293b" stroke="#e2e8f0" stroke-width="4"/>

  <!-- AIRFLOW VECTOR ARROWS -->
  <path d="M 180 290 L 620 290" stroke="#eab308" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M 180 260 L 620 260" stroke="#eab308" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 180 320 L 620 320" stroke="#eab308" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- AIRFOIL / TEST SPECIMEN IN TUNNEL -->
  <path d="M 360,285 C 420,260 460,290 480,290 C 440,295 400,295 360,285 Z" fill="#e2e8f0" stroke="#f59e0b" stroke-width="3"/>

  <!-- DIGITAL SENSOR DASHBOARD -->
  <rect x="200" y="440" width="400" height="60" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="230" y="476" fill="#eab308" font-family="monospace" font-size="18" font-weight="bold">VELOCITY: 35.4 m/s</text>
  <text x="440" y="476" fill="#22c55e" font-family="monospace" font-size="18" font-weight="bold">LIFT: 142 N</text>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="330" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#eab308"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">ENGINEERING RIG &amp; WIND TUNNEL</text>
</svg>
