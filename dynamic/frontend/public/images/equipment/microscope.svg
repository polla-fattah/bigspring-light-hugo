<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0,150 L 800,150 M 0,300 L 800,300 M 0,450 L 800,450" />
    <path d="M 200,0 L 200,600 M 400,0 L 400,600 M 600,0 L 600,600" />
  </g>

  <!-- Lab Tech Glass Glow Circle -->
  <circle cx="400" cy="300" r="220" fill="url(#lensGlow)" />

  <!-- MICROSCOPE BASE -->
  <path d="M 240,510 L 560,510 C 580,510 590,490 580,470 L 540,430 C 530,420 510,420 490,420 L 310,420 C 290,420 270,420 260,430 L 220,470 C 210,490 220,510 240,510 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="260" y="470" width="280" height="30" rx="8" fill="#1e293b"/>
  
  <!-- Base Light Illuminator -->
  <ellipse cx="400" cy="425" rx="35" ry="12" fill="url(#metal)"/>
  <ellipse cx="400" cy="425" rx="25" ry="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- MAIN CURVED ARM -->
  <path d="M 480,430 C 560,410 580,260 520,180 C 490,140 430,140 400,140" fill="none" stroke="url(#metal)" stroke-width="48" stroke-linecap="round"/>
  <path d="M 480,430 C 560,410 580,260 520,180 C 490,140 430,140 400,140" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- STAGE ADJUSTMENT KNOBS -->
  <circle cx="510" cy="360" r="24" fill="url(#gold)"/>
  <circle cx="510" cy="360" r="14" fill="#78350f"/>
  <circle cx="510" cy="360" r="8" fill="url(#gold)"/>

  <!-- MECHANICAL STAGE -->
  <rect x="300" y="320" width="200" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="350" y="318" width="100" height="4" rx="2" fill="#e2e8f0"/>
  <!-- Glass Slide with Specimen -->
  <rect x="360" y="312" width="80" height="6" rx="1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="400" cy="315" r="3" fill="#ef4444"/>

  <!-- REVOLVING NOSEPIECE &amp; OBJECTIVES -->
  <path d="M 370,220 L 430,220 L 420,240 L 380,240 Z" fill="url(#gold)"/>
  
  <!-- Objective Lenses -->
  <!-- Center 40x -->
  <rect x="393" y="240" width="14" height="45" rx="3" fill="url(#metal)" stroke="#475569" stroke-width="2"/>
  <rect x="395" y="270" width="10" height="4" fill="#ef4444"/>
  <!-- Left 10x -->
  <rect x="375" y="240" width="12" height="35" rx="3" fill="url(#metal)" transform="rotate(15 381 240)"/>
  <!-- Right 100x -->
  <rect x="413" y="240" width="12" height="50" rx="3" fill="url(#metal)" transform="rotate(-15 419 240)"/>

  <!-- DUAL EYEPIECE / BINOCULAR HEAD -->
  <path d="M 410,140 L 330,100" fill="none" stroke="url(#metal)" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Left Eyepiece -->
  <rect x="300" y="70" width="22" height="45" rx="4" fill="#1e293b" stroke="url(#gold)" stroke-width="3" transform="rotate(-25 311 90)"/>
  <ellipse cx="302" cy="73" rx="9" ry="4" fill="#38bdf8" transform="rotate(-25 311 90)"/>
  
  <!-- Right Eyepiece -->
  <rect x="335" y="55" width="22" height="45" rx="4" fill="#1e293b" stroke="url(#gold)" stroke-width="3" transform="rotate(-25 346 75)"/>
  <ellipse cx="337" cy="58" rx="9" ry="4" fill="#38bdf8" transform="rotate(-25 346 75)"/>

  <!-- LIGHT CONE BEAM -->
  <polygon points="400,420 370,320 430,320" fill="url(#lensGlow)" opacity="0.6"/>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="240" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#10b981"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">MICROSCOPY SYSTEM</text>
</svg>
