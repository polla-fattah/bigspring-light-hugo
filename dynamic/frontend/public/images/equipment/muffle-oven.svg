<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- MUFFLE FURNACE HEAVY INDUSTRIAL CASING -->
  <rect x="220" y="120" width="360" height="400" rx="28" fill="#334155" stroke="#475569" stroke-width="6"/>

  <!-- HEAVY HEAT CHAMBER DOOR -->
  <rect x="250" y="150" width="300" height="260" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Glowing Heat Core Window -->
  <rect x="280" y="180" width="240" height="200" rx="12" fill="url(#fire)" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Internal Crucible -->
  <path d="M 370,330 L 430,330 L 440,270 L 360,270 Z" fill="#f8fafc" opacity="0.9"/>

  <!-- HEAVY LOCKING LEVER HANDLE -->
  <rect x="520" y="240" width="24" height="100" rx="8" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <circle cx="532" cy="245" r="14" fill="#ef4444"/>

  <!-- DIGITAL PID CONTROLLER PANEL -->
  <rect x="250" y="430" width="300" height="60" rx="12" fill="#0f172a"/>
  <text x="275" y="468" fill="#ef4444" font-family="monospace" font-size="24" font-weight="bold">1100 °C</text>
  <text x="430" y="468" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">HEATING</text>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="290" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#f97316"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">MUFFLE FURNACE / DRYING OVEN</text>
</svg>
