<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="casing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- Spectral Beam Waves Background Graphic -->
  <path d="M 0 450 Q 200 350 400 450 T 800 450" fill="none" stroke="url(#spectrum)" stroke-width="4" opacity="0.3"/>
  <path d="M 0 480 Q 200 380 400 480 T 800 480" fill="none" stroke="url(#spectrum)" stroke-width="2" opacity="0.2"/>

  <!-- MAIN CHASSIS -->
  <rect x="140" y="180" width="520" height="300" rx="32" fill="url(#casing)" stroke="#94a3b8" stroke-width="4"/>
  <rect x="140" y="440" width="520" height="40" rx="16" fill="#0f172a"/>

  <!-- DIGITAL LCD TOUCHSCREEN -->
  <rect x="180" y="220" width="240" height="150" rx="16" fill="url(#screen)" stroke="#0284c7" stroke-width="4"/>
  
  <!-- Graph on Screen -->
  <polyline points="200,340 230,320 260,260 290,330 330,300 370,330 390,340" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polyline points="200,340 230,320 260,260 290,330 330,300 370,330 390,340 390,350 200,350" fill="#38bdf8" opacity="0.2"/>
  <text x="200" y="250" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">λ = 540 nm</text>
  <text x="200" y="270" fill="#7dd3fc" font-family="monospace" font-size="12">ABS: 1.428 AU</text>

  <!-- CUVETTE SAMPLE CHAMBER LID -->
  <rect x="460" y="220" width="160" height="180" rx="16" fill="#334155" stroke="#475569" stroke-width="3"/>
  <rect x="480" y="240" width="120" height="140" rx="8" fill="#1e293b"/>
  
  <!-- Cuvette Slot with Quartz Cuvette -->
  <rect x="525" y="270" width="30" height="80" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
  <!-- Sample Fluid in Cuvette -->
  <rect x="527" y="300" width="26" height="48" rx="2" fill="#ef4444" opacity="0.8"/>
  <!-- Light Beam line thru Cuvette -->
  <line x1="470" y1="310" x2="610" y2="310" stroke="url(#spectrum)" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- POWER BUTTON &amp; CONTROL DIAL -->
  <circle cx="210" cy="405" r="14" fill="#10b981"/>
  <circle cx="210" cy="405" r="10" fill="#047857"/>
  
  <circle cx="270" cy="405" r="18" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <line x1="270" y1="405" x2="270" y2="392" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="280" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#38bdf8"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">UV-VIS SPECTROPHOTOMETER</text>
</svg>
