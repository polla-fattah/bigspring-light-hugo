<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- ACADEMIC SYMPOSIUM / EVENT BANNER GRAPHIC -->
  <rect x="200" y="160" width="400" height="300" rx="32" fill="#1e293b" stroke="#f43f5e" stroke-width="4"/>
  
  <!-- CALENDAR ICON -->
  <rect x="250" y="200" width="100" height="100" rx="16" fill="#f43f5e"/>
  <rect x="250" y="200" width="100" height="30" fill="#9f1239"/>
  <circle cx="280" cy="215" r="4" fill="#ffffff"/>
  <circle cx="320" cy="215" r="4" fill="#ffffff"/>
  <text x="275" y="275" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="900">SEP</text>

  <!-- EVENT DETAILS GRAPHIC -->
  <rect x="380" y="220" width="180" height="18" rx="6" fill="#f8fafc"/>
  <rect x="380" y="250" width="140" height="14" rx="4" fill="#fb7185"/>
  <rect x="380" y="275" width="160" height="14" rx="4" fill="#64748b"/>

  <!-- AUDIENCE / SEMINAR PODIUM -->
