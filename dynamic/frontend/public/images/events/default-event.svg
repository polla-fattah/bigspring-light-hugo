<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#lightBg)"/>

  <!-- ACADEMIC EVENT CARD CONTAINER -->
  <rect x="180" y="140" width="440" height="320" rx="24" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- CALENDAR ICON (LIGHT & CLEAN) -->
  <rect x="220" y="190" width="120" height="120" rx="20" fill="#ffffff" stroke="#991b1b" stroke-width="4"/>
  <path d="M 220,190 L 340,190 L 340,230 L 220,230 Z" fill="#991b1b"/>
  <circle cx="255" cy="210" r="5" fill="#ffffff"/>
  <circle cx="305" cy="210" r="5" fill="#ffffff"/>
  <rect x="250" y="250" width="18" height="18" rx="4" fill="#fecdd3"/>
  <rect x="280" y="250" width="18" height="18" rx="4" fill="#991b1b"/>
  <rect x="250" y="280" width="18" height="18" rx="4" fill="#991b1b"/>
  <rect x="280" y="280" width="18" height="18" rx="4" fill="#fecdd3"/>

  <!-- EVENT DETAILS GRAPHIC LINES -->
  <rect x="370" y="200" width="210" height="20" rx="6" fill="#1e3a8a"/>
  <rect x="370" y="235" width="160" height="14" rx="4" fill="#991b1b"/>
  <rect x="370" y="265" width="185" height="12" rx="4" fill="#94a3b8"/>
  <rect x="370" y="290" width="140" height="12" rx="4" fill="#cbd5e1"/>

  <!-- SEMINAR PODIUM / STAGE GRAPHIC -->
  <path d="M 220,400 L 580,400 L 600,370 L 200,370 Z" fill="#991b1b" opacity="0.85"/>
  <rect x="375" y="340" width="50" height="30" rx="4" fill="#1e3a8a"/>

  <!-- LIGHT TEXT BADGE -->
  <rect x="50" y="50" width="340" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#991b1b"/>
  <text x="94" y="79" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="1">SUE RESEARCH CENTER EVENT</text>
</svg>
