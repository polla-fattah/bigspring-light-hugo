<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- LAB BENCH &amp; GLASSWARE GRAPHICS -->
  <!-- Erlenmeyer Flask 1 -->
  <polygon points="260,400 340,400 370,250 230,250" fill="url(#glass)" stroke="#e879f9" stroke-width="4"/>
  <path d="M 235 340 A 55 55 0 0 0 365 340 Z" fill="#d946ef" opacity="0.8"/>

  <!-- Erlenmeyer Flask 2 -->
  <polygon points="460,420 540,420 570,290 430,290" fill="url(#glass)" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 438 370 A 55 55 0 0 0 562 370 Z" fill="#0284c7" opacity="0.8"/>

  <!-- MOLECULAR STRUCTURE BOND CONNECTORS -->
  <circle cx="300" cy="180" r="16" fill="#f43f5e"/>
  <circle cx="420" cy="140" r="22" fill="#38bdf8"/>
  <circle cx="520" cy="190" r="18" fill="#eab308"/>
  
  <line x1="300" y1="180" x2="420" y2="140" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6,4"/>
  <line x1="420" y1="140" x2="520" y2="190" stroke="#f8fafc" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- TEXT BADGE -->
  <rect x="50" y="50" width="320" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="74" cy="74" r="8" fill="#e879f9"/>
  <text x="94" y="79" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">SURC SPECIALIZED LABORATORY</text>
</svg>
