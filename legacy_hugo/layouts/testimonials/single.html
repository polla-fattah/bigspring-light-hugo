{{ define "main" }}

<section class="section bg-light">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 mx-auto">
        <div class="testimonial-single-card p-5 rounded-3 shadow-sm bg-white">
          <div class="testimonial-content mb-4">
            <div class="quote-icon mb-4">
              <i class="fas fa-quote-left text-primary" style="font-size: 3rem;"></i>
            </div>
            <div class="testimonial-text">
              {{ .Params.content | default .Content | markdownify }}
            </div>
          </div>
          <div class="testimonial-author-info pt-4 border-top">
            <h3 class="mb-2 fw-bold">{{ .Params.name | default .Title | markdownify }}</h3>
            <p class="text-muted mb-0">{{ .Params.designation | markdownify }}</p>
            {{ if .Date }}
            <p class="text-muted small mt-2 mb-0">
              <i class="fas fa-calendar me-2"></i>{{ .Date.Format "January 2, 2006" }}
            </p>
            {{ end }}
          </div>
          <div class="mt-4">
            <a href="/testimonials/" class="btn btn-outline-primary">
              <i class="fas fa-arrow-left me-2"></i>Back to All Testimonials
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
